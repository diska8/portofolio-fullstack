<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio - Junior Full Stack Developer</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Menggunakan font GoogleInter untuk tampilan modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="logo">MyPortfolio</div>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
      </ul>
    </nav>

    <!-- Hero / Profile Section -->
    <section id="about" class="section hero-section">
      <div class="container">
        <h1 id="user-name">Loading...</h1>
        <p id="user-role" class="role-badge">Loading...</p>
        <p id="user-about" class="about-text">Loading...</p>
      </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="section">
      <div class="container">
        <h2>Tech Stack & Skills</h2>
        <div id="skills-container" class="skills-grid">
          <!-- Skills akan di-load lewat JavaScript -->
        </div>
      </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section">
      <div class="container">
        <h2>Featured Projects</h2>
        <div id="projects-container" class="projects-grid">
          <!-- Projects akan di-load lewat JavaScript -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>
        &copy; 2026 Junior Full Stack Developer. Built with Golang & Vanilla JS.
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
